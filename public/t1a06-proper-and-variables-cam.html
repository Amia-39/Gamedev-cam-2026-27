<head>
	<title>t1a06-proper-and-variables-cam.html</title>
	<script>
		function sayHello() {
			myNum = 3;
			myString = ' Hello ';
			myFloat = 17.5;
			myBool = true;
			myOut = document.getElementById('myDiv01');
			myOut.innerHTML = myNum + myString + myFloat + ', ' + myBool;
			if (myBool) {myOut.innerHTML += ', WOW';}
		}
	</script>
</head>
<body>
	<p>This is <b>bold</b> text.</p>
	<button onclick="sayHello()">click</button>
	<div id="myDiv01">...</div>
</body>
