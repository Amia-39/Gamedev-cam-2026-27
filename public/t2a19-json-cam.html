<h2 align=center>t2a19-json-cam.html</h2>

<script>
async function fetchData(url) {
  const response = await fetch(url);
  const data = await response.json();
  console.log(data);

  const myJson =JSON.stringify(data, null, 2);
  document.getElementById("myDiv01").innerHTML = `<pre>${myJson}</pre>`;

  document.getElementById("myDiv01").innerHTML += `<img src="${data.image}" alt="Random Image" style="max-width: 100%; height: auto;">`;

}
</script>

<select id="mySelect" size="1" onchange="fetchData(this.value)">
  <option ></option>
  <option value="https://randomfox.ca/floof/">Random Fox</option>  
  <option value="https://foodish-api.com/api/">Random Food</option>

</select>

<div id="myDiv01">...</div>
